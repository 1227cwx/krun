name: Portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Quality checks
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and Cargo version differ' }
          ./build-release.ps1
          $zip = "KRun-$($env:RELEASE_TAG)-windows-x64.zip"
          Compress-Archive -Path release/KRun.exe, LICENSE -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$pwd/SHA256SUMS", "$hash  $zip`n", [Text.UTF8Encoding]::new($false))
      - name: Publish portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to replace assets' }
          gh release create $env:RELEASE_TAG "KRun-$($env:RELEASE_TAG)-windows-x64.zip" SHA256SUMS --verify-tag --title "KRun $($env:RELEASE_TAG) · 原生便携启动器" --notes-file .github/release-notes.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

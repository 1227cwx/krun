<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KRun，一款极简、极速、资源占用极低的 Windows 启动器。">
  <meta name="theme-color" content="#f7f8f8">
  <title>KRun · Windows 分类启动器</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="header">
    <a class="brand" href="./"><img src="icon.svg" width="28" height="28" alt="">KRun</a>
    <nav aria-label="主导航">
      <a href="https://github.com/1227cwx/krun" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/1227cwx/krun/releases/latest" target="_blank" rel="noopener">下载</a>
    </nav>
  </header>
  <main id="main">
    <section class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title">KRun，让常用触手可及。</h1>
      <p class="intro-description">轻量、极简的开源 Windows 启动器。</p>
      <p class="intro-features">Rust 原生构建 · 无需安装 · 配置本地保存</p>
    </section>
    <div class="preview-scroll" tabindex="0" aria-label="KRun 交互演示，窄屏可横向滚动">
      <div class="preview-stage">
        <section class="app-window" aria-label="KRun 交互演示">
          <div id="app-shell">
            <div class="titlebar">
              <button id="back-button" class="tool back" aria-label="返回启动板" hidden data-icon="back"></button>
              <span id="window-title">KRun</span>
              <div class="title-tools">
                <button id="search-button" class="tool" aria-label="搜索" title="搜索" aria-expanded="false" aria-controls="search-bar" data-icon="search"></button>
                <button id="add-button" class="tool" aria-label="添加" title="添加" aria-haspopup="menu" aria-expanded="false" aria-controls="add-menu" data-icon="plus"></button>
                <button id="settings-button" class="tool" aria-label="设置" title="设置" aria-expanded="false" aria-controls="settings-view" data-icon="settings"></button>
                <button id="close-button" class="tool close" aria-label="关闭演示窗口" title="关闭" data-icon="close"></button>
              </div>
            </div>
            <div id="add-menu" class="context-menu" role="menu" aria-label="添加" hidden>
              <button id="add-menu-item" role="menuitem" type="button">添加项目</button>
              <button id="add-menu-category" role="menuitem" type="button">新建分类</button>
            </div>
            <div id="item-menu" class="context-menu" role="menu" aria-label="项目操作" hidden>
              <button role="menuitem" type="button" data-item-action="run">运行</button>
              <button role="menuitem" type="button" data-item-action="admin">以管理员身份运行</button>
              <button role="menuitem" type="button" data-item-action="open-with">打开方式...</button>
              <div class="menu-separator" role="separator"></div>
              <button id="item-change-icon" role="menuitem" type="button">修改图标...</button>
              <button id="item-restore-icon" role="menuitem" type="button">恢复默认图标</button>
              <div class="menu-separator" role="separator"></div>
              <button role="menuitem" type="button" data-item-action="reveal">打开文件所在位置</button>
              <button role="menuitem" type="button" data-item-action="copy">复制完整路径</button>
              <div class="menu-separator" role="separator"></div>
              <button id="item-move" role="menuitem" type="button" aria-haspopup="menu" aria-expanded="false">移动到分类<span aria-hidden="true">›</span></button>
              <div class="menu-separator" role="separator"></div>
              <button role="menuitem" type="button" data-item-action="new">新建项目</button>
              <button role="menuitem" type="button" data-item-action="sort">按名称排序</button>
              <div class="menu-separator" role="separator"></div>
              <button role="menuitem" type="button" data-item-action="rename">重命名</button>
              <button role="menuitem" type="button" data-item-action="delete">删除</button>
            </div>
            <div id="move-menu" class="submenu" role="menu" aria-label="移动到分类" hidden></div>
            <div id="category-context-menu" class="context-menu" role="menu" aria-label="分类操作" hidden>
              <button id="category-new" role="menuitem" type="button">新建分类</button>
              <button id="category-rename" role="menuitem" type="button">重命名分类</button>
              <div class="menu-separator" role="separator"></div>
              <button id="category-delete" role="menuitem" type="button">删除分类</button>
            </div>
            <div id="launcher-view">
              <div class="categorybar">
                <div id="tabs" role="tablist" aria-label="项目分类"></div>
                <div class="category-tools">
                  <button id="category-left" class="tool" aria-label="上一组分类" data-icon="back" hidden></button>
                  <button id="category-right" class="tool" aria-label="下一组分类" data-icon="right" hidden></button>
                  <button id="category-more" class="tool" aria-label="所有分类" aria-expanded="false" aria-controls="category-menu" data-icon="more" hidden></button>
                </div>
              </div>
              <div id="category-menu" role="menu" aria-label="所有分类" hidden></div>
              <div id="search-bar" hidden>
                <input id="demo-search" aria-label="搜索项目名称或路径" placeholder="搜索项目" autocomplete="off" spellcheck="false">
                <button id="search-close" class="tool" aria-label="关闭搜索" data-icon="close"></button>
              </div>
              <div id="demo-panel" role="tabpanel" tabindex="0"><div id="demo-grid"></div><p id="empty" hidden>没有匹配的项目</p></div>
            </div>
            <div id="settings-view" hidden>
              <div class="setting-row"><label for="hotkey">显示快捷键<small>点击后按下新的组合键</small></label><button id="hotkey">Alt + Q</button></div>
              <label class="setting-row"> <span>开机启动<small>登录 Windows 后在后台运行</small></span><input id="startup" type="checkbox" role="switch"></label>
              <label class="setting-row"><span>项目双击运行<small>开启后单击选择，双击运行</small></span><input id="double-click" type="checkbox" role="switch" checked></label>
              <label class="setting-row"><span>居中显示<small>每次在当前屏幕居中，默认开启</small></span><input id="centered" type="checkbox" checked></label>
              <label class="setting-row"><span>允许移动<small>关闭后锁定位置；居中时不可用</small></span><input id="movable" type="checkbox" role="switch" disabled></label>
              <label class="setting-row"><span>允许调整大小<small>使用窗口边缘改变启动板尺寸</small></span><input id="resizable" type="checkbox" role="switch" checked></label>
            </div>
            <input id="icon-file" type="file" accept=".ico,.png,.jpg,.jpeg,.svg,image/*" hidden>
          </div>
          <div id="overlay" hidden>
            <div id="add-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="add-title" hidden>
              <h2 id="add-title">添加项目</h2>
              <button id="add-close" class="tool" aria-label="关闭添加项目" data-icon="close"></button>
              <div class="add-actions"><button id="add-file" class="accent">选择文件</button><button id="add-folder">选择文件夹</button></div>
              <div id="drop-zone">也可以把程序、快捷方式、文件或文件夹拖到这里</div>
            </div>
            <form id="category-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="category-title" hidden>
              <h2 id="category-title">新建分类</h2>
              <input id="category-name" aria-label="分类名称" maxlength="30" required autocomplete="off">
              <div class="dialog-actions"><button class="accent" type="submit">确定</button><button id="category-cancel" type="button">取消</button></div>
            </form>
            <div id="confirm-dialog" class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
              <h2 id="confirm-title">删除分类</h2>
              <p id="confirm-message"></p>
              <div class="dialog-actions"><button id="confirm-submit" class="accent" type="button">删除</button><button id="confirm-cancel" type="button">取消</button></div>
            </div>
          </div>
          <button id="restore-button" hidden><img src="icon.svg" alt="" width="28" height="28">重新打开 KRun 演示</button>
          <div id="resize-handle" aria-hidden="true"></div>
        </section>
      </div>
    </div>
    <a class="download" href="https://github.com/1227cwx/krun/releases/latest" target="_blank" rel="noopener">下载 KRun</a>
    <p class="platform">Windows 10 / 11 · x64</p>
    <noscript><p>启用 JavaScript 即可体验交互演示。</p></noscript>
  </main>
  <footer><div><a href="https://github.com/1227cwx/krun/blob/main/LICENSE" target="_blank" rel="noopener">MIT</a><a href="https://github.com/1227cwx/krun" target="_blank" rel="noopener">源代码</a></div></footer>
</body>
</html>
